
name: SecurePay CI

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-and-tests:
    name: Tests and Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install bandit pip-audit

      - name: Run automated tests
        run: python -m pytest -v

      - name: Run Bandit SAST
        run: bandit -r app -ll

      - name: Run pip-audit SCA
        run: pip-audit -r requirements.txt

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start SecurePay API for DAST
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/securepay-api.log 2>&1 &
          echo $! > /tmp/securepay-api.pid

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo "SecurePay API is ready"
              exit 0
            fi
            sleep 2
          done

          echo "SecurePay API failed to start"
          cat /tmp/securepay-api.log
          exit 1

      - name: Run OWASP ZAP DAST
        run: |
          docker run --rm --network host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8000 \
            -m 1

  artifact-signing:
    name: Sign and Verify Build Artifact
    needs: security-and-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Package source code
        run: |
          tar --exclude='.git' \
              --exclude='.venv' \
              --exclude='__pycache__' \
              --exclude='.pytest_cache' \
              --exclude='reports' \
              -czf securepay-source.tar.gz \
              app tests docs .github requirements.txt .gitignore

      - name: Sign build artifact
        run: |
          cosign sign-blob securepay-source.tar.gz \
            --bundle securepay-source.sigstore.json \
            --yes

      - name: Verify artifact signature
        run: |
          cosign verify-blob securepay-source.tar.gz \
            --bundle securepay-source.sigstore.json \
            --certificate-identity \
            "https://github.com/AliYasser2003/SecurePay_Depi_Project/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer \
            "https://token.actions.githubusercontent.com"

  aws-oidc-auth:
    name: Verify AWS OIDC Authentication
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Show GitHub OIDC context
        env:
          EXPECTED_REPOSITORY: AliYasser2003/SecurePay_Depi_Project
          EXPECTED_BRANCH: refs/heads/main
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = "$EXPECTED_BRANCH"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity
